services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: itii-assist-backend:latest
    container_name: itii-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_EXPOSE_PORT:-8000}:8000"
    environment:
      TZ: Asia/Bangkok
      DOCKER_HOST: unix:///var/run/docker.sock
      MONITOR_PROBE_URLS: ${MONITOR_PROBE_URLS:-http://host.docker.internal:3000/,http://localhost:8000/api/health}
      DB_HOST: ${DB_HOST:-itii-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-itii_user}
      DB_PASSWORD: ${DB_PASSWORD:-2b15y2d2h6wzgZIksSSIkwR7udsbuCduKkdIrGtsPDhwJZVoVFdqR7m}
      DB_NAME: ${DB_NAME:-itii_assist}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-160}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-40}
      DB_CONN_MAX_LIFETIME_MINUTES: ${DB_CONN_MAX_LIFETIME_MINUTES:-30}
      DB_CONN_MAX_IDLE_TIME_MINUTES: ${DB_CONN_MAX_IDLE_TIME_MINUTES:-10}
      REDIS_ADDR: ${REDIS_ADDR:-itii-redis:6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-2000}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-20}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-4}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - itii-net

  redis:
    image: redis:7-alpine
    container_name: itii-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - itii-net

volumes:
  redis-data:

networks:
  itii-net:
    name: itii-net
    external: true
