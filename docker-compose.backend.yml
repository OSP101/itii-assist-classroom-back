services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: itii-assist-backend:latest
    container_name: itii-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_EXPOSE_PORT:-8000}:8000"
    environment:
      TZ: Asia/Bangkok
      DB_HOST: ${DB_HOST:-itii-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-itii_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_now}
      DB_NAME: ${DB_NAME:-itii_assist}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-1000}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-300}
      DB_CONN_MAX_LIFETIME_MINUTES: ${DB_CONN_MAX_LIFETIME_MINUTES:-30}
      DB_CONN_MAX_IDLE_TIME_MINUTES: ${DB_CONN_MAX_IDLE_TIME_MINUTES:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    networks:
      - itii-net

networks:
  itii-net:
    name: itii-net
    external: true
